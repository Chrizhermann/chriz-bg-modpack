name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-check:
    name: WeiDU 249 / generated-fixture and package suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Check the campaign XP package against its sources and native build record
        run: python3 tools/sync_campaign_xp.py --check

      - name: Install WeiDU
        run: |
          WEIDU_VERSION="249.00"
          WEIDU_SHORT="249"
          WEIDU_ZIP_SHA256="812da3eedd141ada27bb91469ff5da78a2709732949777b37b9ead9b67f89af0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output weidu.zip \
            "https://github.com/WeiDUorg/weidu/releases/download/v${WEIDU_VERSION}/WeiDU-Linux-${WEIDU_SHORT}-amd64.zip"
          echo "${WEIDU_ZIP_SHA256}  weidu.zip" | sha256sum --check --strict
          unzip -q weidu.zip
          WEIDU_BIN="WeiDU-Linux/weidu"
          test -f "$WEIDU_BIN"
          chmod +x "$WEIDU_BIN"
          sudo mv "$WEIDU_BIN" /usr/local/bin/weidu

      - name: Verify WeiDU binary
        run: |
          test "$(weidu --version 2>&1 | sed -n 's/.*WeiDU version \([0-9][0-9]*\).*/\1/p' | head -1)" = "24900"

      - name: Parse-check tp2
        run: weidu --noautoupdate --nogame --parse-check TP2 setup-chriz-bg-modpack.tp2

      - name: Parse-check every WeiDU library
        run: |
          while IFS= read -r library; do
            weidu --noautoupdate --nogame --parse-check TPA "$library"
          done < <(find chriz-bg-modpack/lib -type f -name '*.tpa' -print | LC_ALL=C sort)

      - name: Fetch pinned EET parser for isolated fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/cbm-eet/lib"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/cbm-eet/lib/macros.tph" \
            https://raw.githubusercontent.com/Gibberlings3/EET/ad20ca29ae797e773fffb10c25537c1b1a674716/EET/lib/macros.tph

      - name: Fetch pinned EEex v1.3.1 scripts for the campaign XP tests (tests/pinned_eeex.py)
        run: |
          EEEX_COMMIT="a6d21abe44e20509f5d0259ccc6c7e7f9d12b285"
          scripts="$RUNNER_TEMP/cbm-eeex/EEex/copy/EEex_scripts"
          mkdir -p "$scripts"
          fetch() {
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$scripts/$1" \
              "https://raw.githubusercontent.com/Bubb13/EEex/${EEEX_COMMIT}/EEex/copy/EEex_scripts/$1"
            echo "$2  $scripts/$1" | sha256sum --check --strict
          }
          fetch EEex_Action.lua 18ea2ed7974984d7da66ac315ca035574cc4faa2802f55c4f431efca2862787b
          fetch EEex_Keybinds.lua 0a0ff929beaffc8e5c1b039175600c286cc6816334052b92d648414eb5e14887
          fetch EEex_Menu.lua 13097865d63812e6b006812b21f4d874ee4a1651b2e93c6f2ba551c976732702
          fetch EEex_Sprite.lua 60c48e00d7682be7716306fa10a868f079cb55bec77175467ec316b74354a8be

      - name: Run game-free regression tests
        env:
          WEIDU_BIN: /usr/local/bin/weidu
          WEIDU: /usr/local/bin/weidu
          CBM_EET_SOURCE: ${{ runner.temp }}/cbm-eet
        run: python3 -m unittest discover -s tests -v

      - name: Test XP runtimes, companion choices, artwork hooks, and UI adapter
        env:
          WEIDU_BIN: /usr/local/bin/weidu
          WEIDU: /usr/local/bin/weidu
          CBM_EEEX_SOURCE: ${{ runner.temp }}/cbm-eeex
        run: python3 -m tools.ci_pytest -q

      - name: Build the production archive reproducibly
        run: |
          WINDOWS_WEIDU_URL="https://github.com/WeiDUorg/weidu/releases/download/v249.00/WeiDU-Windows-249-amd64.zip"
          WINDOWS_WEIDU_SHA256="b156910cbec69359fc2e42f6739aa959d49047d6fd3dc172f6bed88ffad8f927"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output weidu-windows.zip "$WINDOWS_WEIDU_URL"
          echo "${WINDOWS_WEIDU_SHA256}  weidu-windows.zip" | sha256sum --check --strict
          python3 -m tools.build_release --output dist-one --weidu-archive weidu-windows.zip
          python3 -m tools.build_release --output dist-two --weidu-archive weidu-windows.zip
          VERSION="$(tr -d '\r\n' < VERSION)"
          cmp "dist-one/chriz-bg-modpack-${VERSION}.zip" \
              "dist-two/chriz-bg-modpack-${VERSION}.zip"

      - name: Test install and uninstall from the extracted archive
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          WEIDU_BIN=/usr/local/bin/weidu \
          WEIDU=/usr/local/bin/weidu \
          CBM_RELEASE_ARCHIVE="dist-one/chriz-bg-modpack-${VERSION}.zip" \
            python3 -m unittest tests.test_release_archive tests.test_release_new_components -v
