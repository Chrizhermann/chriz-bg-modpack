name: release-package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and accept Windows release ZIP
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r tests/requirements.txt

      - name: Verify tagged version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $expected"
          }

      - name: Install pinned WeiDU 249
        shell: pwsh
        run: |
          $url = 'https://github.com/WeiDUorg/weidu/releases/download/v249.00/WeiDU-Windows-249-amd64.zip'
          $expected = 'b156910cbec69359fc2e42f6739aa959d49047d6fd3dc172f6bed88ffad8f927'
          curl.exe --fail --location --proto '=https' --tlsv1.2 --output weidu-windows.zip $url
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath weidu-windows.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "WeiDU archive hash mismatch: $actual" }
          Expand-Archive -LiteralPath weidu-windows.zip -DestinationPath . -Force
          $version = (& .\WeiDU-Windows\weidu.exe --version 2>&1 | Out-String)
          if ($version -notmatch 'WeiDU version 24900') { throw "Unexpected WeiDU version: $version" }
          "$env:GITHUB_WORKSPACE\WeiDU-Windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Parse-check installer and libraries
        shell: pwsh
        run: |
          weidu.exe --noautoupdate --nogame --parse-check TP2 setup-chriz-bg-modpack.tp2
          if ($LASTEXITCODE -ne 0) { throw "Main TP2 parse-check failed" }
          Get-ChildItem -LiteralPath chriz-bg-modpack\lib -Filter *.tpa | Sort-Object Name | ForEach-Object {
            weidu.exe --noautoupdate --nogame --parse-check TPA $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Parse-check failed: $($_.FullName)" }
          }

      - name: Fetch pinned EET parser for isolated fixtures
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'cbm-eet'
          New-Item -ItemType Directory -Force -Path (Join-Path $fixtureRoot 'lib') | Out-Null
          curl.exe --fail --location --proto '=https' --tlsv1.2 --output (Join-Path $fixtureRoot 'lib/macros.tph') 'https://raw.githubusercontent.com/Gibberlings3/EET/ad20ca29ae797e773fffb10c25537c1b1a674716/EET/lib/macros.tph'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned EET parser download failed' }
          "CBM_EET_SOURCE=$fixtureRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned EEex v1.3.1 scripts for the campaign XP tests (tests/pinned_eeex.py)
        shell: pwsh
        run: |
          $commit = 'a6d21abe44e20509f5d0259ccc6c7e7f9d12b285'
          $eeexRoot = Join-Path $env:RUNNER_TEMP 'cbm-eeex'
          $scripts = Join-Path $eeexRoot 'EEex/copy/EEex_scripts'
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          $pins = [ordered]@{
            'EEex_Action.lua' = '18ea2ed7974984d7da66ac315ca035574cc4faa2802f55c4f431efca2862787b'
            'EEex_Keybinds.lua' = '0a0ff929beaffc8e5c1b039175600c286cc6816334052b92d648414eb5e14887'
            'EEex_Menu.lua' = '13097865d63812e6b006812b21f4d874ee4a1651b2e93c6f2ba551c976732702'
            'EEex_Sprite.lua' = '60c48e00d7682be7716306fa10a868f079cb55bec77175467ec316b74354a8be'
          }
          foreach ($name in $pins.Keys) {
            $file = Join-Path $scripts $name
            curl.exe --fail --location --proto '=https' --tlsv1.2 --output $file "https://raw.githubusercontent.com/Bubb13/EEex/$commit/EEex/copy/EEex_scripts/$name"
            if ($LASTEXITCODE -ne 0) { throw "Pinned EEex download failed: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($actual -ne $pins[$name]) { throw "Pinned EEex hash mismatch for ${name}: $actual" }
          }
          "CBM_EEEX_SOURCE=$eeexRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run generated-fixture regression tests
        shell: pwsh
        env:
          WEIDU_BIN: weidu.exe
          WEIDU: weidu.exe
        run: python -m unittest discover -s tests -v

      - name: Test XP runtimes, companion choices, artwork hooks, and UI adapter
        shell: pwsh
        env:
          WEIDU_BIN: weidu.exe
          WEIDU: weidu.exe
        # test_scroll_runtime_installer.py runs the shipped Windows policy EXE, so it stays Windows-only and explicit here.
        run: python -m tools.ci_pytest tests/test_scroll_runtime_installer.py -q

      - name: Build deterministic release twice
        shell: pwsh
        run: |
          python -m tools.build_release --output dist --weidu-archive weidu-windows.zip
          python -m tools.build_release --output dist-second --weidu-archive weidu-windows.zip
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $first = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\chriz-bg-modpack-$version.zip").Hash
          $second = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist-second\chriz-bg-modpack-$version.zip").Hash
          if ($first -ne $second) { throw "Release builds are not byte-reproducible" }

      - name: Test the bundled installer from the extracted archive
        shell: pwsh
        env:
          WEIDU_BIN: weidu.exe
          WEIDU: weidu.exe
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $env:CBM_RELEASE_ARCHIVE = "dist\chriz-bg-modpack-$version.zip"
          $env:CBM_USE_BUNDLED_WEIDU = '1'
          python -m unittest tests.test_release_archive tests.test_release_new_components -v

      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chriz-bg-modpack-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
